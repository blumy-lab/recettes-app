# ─────────────────────────────────────────────────────────────────────────
# CI minimale : lint + tests + build de production sur chaque push et PR
# vers la branche principale. Objectif : détecter les régressions avant
# tout déploiement (le déploiement lui-même reste manuel).
#
# Secrets GitHub à configurer avant que CI passe réellement au vert
# (Settings → Secrets and variables → Actions → New repository secret) :
#   VITE_SUPABASE_URL       URL du projet Supabase (ex: https://xxxx.supabase.co)
#   VITE_SUPABASE_ANON_KEY  Clé anonyme publique Supabase (jamais la clé service_role)
#   VITE_APP_URL            URL de déploiement de l'app
#
# Définies au niveau du JOB (pas juste sur l'étape build) car
# `src/lib/supabase.ts` appelle createClient() dès l'import du module —
# donc `vitest run` exécute ce code et plante avec "supabaseUrl is
# required" si ces variables sont absentes à ce moment-là, même si
# `npm run build` (compilation statique seule) fonctionnerait sans elles.
#
# Ne jamais mettre la clé GEMINI_API_KEY ici : elle n'est utilisée que
# côté serveur (secret Supabase), jamais par le build front.
# ─────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx vitest run

      - run: npm run build
